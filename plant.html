<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>植物ページ</title>
    <link rel="stylesheet" href="style.css?v=13">
</head>
<body>

<a href="javascript:history.back()">←戻る</a>

<h1 id="plantName"></h1>

<button id="renamePlantBtn">
    ✏️植物名変更
</button>

<button id="addRecordBtn">＋記録追加</button>

<div class="sort-box">
    <button id="newestBtn">新しい順</button>
    <button id="oldestBtn">古い順</button>
</div>

<button id="archivePlantBtn">📚アーカイブへ移動</button>

<button id="restorePlantBtn">
    🌱育成中へ戻す
</button>

<div id="records"></div>

<div id="photoModal" class="photo-modal">
    <div class="photo-modal-content">
        <button id="closeModalBtn" class="modal-close-btn">×</button>

        <img id="modalImage">

        <div class="modal-action-row">
            <button id="setCoverBtn">⭐ 表紙に設定</button>
            <button id="deletePhotoBtn">🗑 削除</button>
            <button id="moveToUnclassifiedBtn">↩ 未分類へ</button>
        </div>
    </div>
</div>


<script>
const params = new URLSearchParams(window.location.search);
const plantName = params.get("name");

document.getElementById("plantName").textContent = plantName;

const recordsContainer = document.getElementById("records");
const addRecordBtn = document.getElementById("addRecordBtn");
const archivePlantBtn = document.getElementById("archivePlantBtn");
const restorePlantBtn = document.getElementById("restorePlantBtn");
const newestBtn = document.getElementById("newestBtn");
const oldestBtn = document.getElementById("oldestBtn");
const photoModal = document.getElementById("photoModal");
const modalImage = document.getElementById("modalImage");
const closeModalBtn = document.getElementById("closeModalBtn");
const deletePhotoBtn = document.getElementById("deletePhotoBtn");

const moveToUnclassifiedBtn =
    document.getElementById("moveToUnclassifiedBtn");

const setCoverBtn =
    document.getElementById(
        "setCoverBtn"
    );

const renamePlantBtn =
    document.getElementById(
        "renamePlantBtn"
    );

let currentRecordIndex = null;
let currentPhotoIndex = null;

let sortOrder =
    localStorage.getItem("sortOrder_" + plantName) || "newest";

const plants =
    JSON.parse(
        localStorage.getItem("plants")
    ) || [];

const currentPlant =
    plants.find(
        plant =>
            plant.name === plantName
    );

if(currentPlant?.archived){

    archivePlantBtn.style.display =
        "none";

}else{

    restorePlantBtn.style.display =
        "none";

}

function getStorageKey() {
    return "records_" + plantName;
}

function loadRecords() {
    return JSON.parse(localStorage.getItem(getStorageKey())) || [];
}

function saveRecords(records) {
    localStorage.setItem(getStorageKey(), JSON.stringify(records));
}

function getPhotoSrc(photo) {
    if (typeof photo === "string") {
        return photo;
    }

    if (photo.src) {
        return photo.src;
    }

    return "";
}

function getPhotoDate(photo, fallbackDate) {
    return typeof photo === "string" ? fallbackDate : photo.date || fallbackDate;
}

const DB_NAME = "plantPhotoDB";
const DB_VERSION = 1;
const PHOTO_STORE = "photos";

function openPhotoDB() {
    return new Promise((resolve, reject) => {
        const request = indexedDB.open(DB_NAME, DB_VERSION);

        request.onupgradeneeded = () => {
            const db = request.result;

            if (!db.objectStoreNames.contains(PHOTO_STORE)) {
                db.createObjectStore(PHOTO_STORE, {
                    keyPath: "id"
                });
            }
        };

        request.onsuccess = () => {
            resolve(request.result);
        };

        request.onerror = () => {
            reject(request.error);
        };
    });
}

async function savePhotoToDB(src) {
    const db = await openPhotoDB();

    const photo = {
        id: Date.now().toString() + Math.random().toString(16).slice(2),
        src: src
    };

    return new Promise((resolve, reject) => {
        const transaction = db.transaction(PHOTO_STORE, "readwrite");
        const store = transaction.objectStore(PHOTO_STORE);

        store.add(photo);

        transaction.oncomplete = () => {
            resolve(photo.id);
        };

        transaction.onerror = () => {
            reject(transaction.error);
        };
    });
}

async function getPhotoFromDB(id) {
    const db = await openPhotoDB();

    return new Promise((resolve, reject) => {
        const transaction = db.transaction(PHOTO_STORE, "readonly");
        const store = transaction.objectStore(PHOTO_STORE);
        const request = store.get(id);

        request.onsuccess = () => {
            resolve(request.result ? request.result.src : "");
        };

        request.onerror = () => {
            reject(request.error);
        };
    });
}

async function deletePhotoFromDB(id) {
    const db = await openPhotoDB();

    return new Promise((resolve, reject) => {
        const transaction = db.transaction(PHOTO_STORE, "readwrite");
        const store = transaction.objectStore(PHOTO_STORE);

        store.delete(id);

        transaction.oncomplete = () => {
            resolve();
        };

        transaction.onerror = () => {
            reject(transaction.error);
        };
    });
}

function compressImage(file, maxWidth = 700, quality = 0.45) {
    return new Promise((resolve) => {
        const reader = new FileReader();

        reader.onload = () => {
            const img = new Image();

            img.onload = () => {
                const canvas = document.createElement("canvas");

                let width = img.width;
                let height = img.height;

                if (width > maxWidth) {
                    height = Math.round(height * maxWidth / width);
                    width = maxWidth;
                }

                canvas.width = width;
                canvas.height = height;

                const ctx = canvas.getContext("2d");

                ctx.drawImage(img, 0, 0, width, height);

                const compressedDataUrl =
                    canvas.toDataURL("image/jpeg", quality);

                resolve(compressedDataUrl);
            };

            img.src = reader.result;
        };

        reader.readAsDataURL(file);
    });
}

function renderRecords() {

    const records = loadRecords();

const displayRecords = [...records].sort((a, b) => {

    const dateA = new Date(a.date);
    const dateB = new Date(b.date);

    if (sortOrder === "newest") {
        return dateB - dateA;
    } else {
        return dateA - dateB;
    }

});

    recordsContainer.innerHTML = "";

    if (records.length === 0) {
        recordsContainer.innerHTML =
            "<div class='plant-card'>記録はまだありません</div>";
        return;
    }

   displayRecords.forEach((record) => {
    const recordIndex = records.indexOf(record);
        const card = document.createElement("div");
        card.className = "plant-card";

        if (!record.photos) {
            record.photos = record.photo ? [record.photo] : [];
        }

        const imagesHtml = record.photos
            .map((photo, photoIndex) => `
                <img 
                    src="${getPhotoSrc(photo) || 'data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 width=%22200%22 height=%22150%22%3E%3Crect width=%22200%22 height=%22150%22 fill=%22%23eef5ee%22/%3E%3Ctext x=%2250%25%22 y=%2250%25%22 text-anchor=%22middle%22 dominant-baseline=%22middle%22 font-size=%2220%22%3E🌱%3C/text%3E%3C/svg%3E'}"
data-photo-id="${photo.id || ''}"
                    class="record-photo"
                    data-record-index="${recordIndex}"
                    data-photo-index="${photoIndex}"
                >
            `)
            .join("");

        card.innerHTML = `
            <div class="record-date">
                ${record.date}
            </div>
            <br><br>
            <div class="photo-row">
                ${imagesHtml}
            </div>
            <br>
            
            ${record.fertilizer
                ? `<div class="record-info">💩 ${record.fertilizer}</div>`
                : ""}

            ${record.pesticide
                ? `<div class="record-info">🧪 ${record.pesticide}</div>`
                : ""}

<div class="record-memo">
    ${record.memo}
</div>
            <br><br>
            <div class="record-actions">
    <button class="photoBtn">📷追加</button>
    <button class="editBtn">✏️編集</button>
    <button class="deleteBtn">🗑削除</button>
</div>
        `;

        card.querySelectorAll(".record-photo").forEach(img => {
            img.addEventListener("click", () => {
                currentRecordIndex = Number(img.dataset.recordIndex);
                currentPhotoIndex = Number(img.dataset.photoIndex);

                modalImage.src = img.src;
                photoModal.style.display = "flex";
            });
        });

        card.querySelector(".photoBtn").addEventListener("click", () => {
            selectPhotos(recordIndex);
        });

        card.querySelector(".editBtn").addEventListener("click", () => {
    const newDate = prompt("日付を編集してください", record.date);

    if (newDate === null) return;

    const newMemo = prompt("メモを編集してください", record.memo);

    if (newMemo === null) return;

    records[recordIndex].date = newDate;
    records[recordIndex].memo = newMemo;

    saveRecords(records);
    renderRecords();
});

        card.querySelector(".deleteBtn").addEventListener("click", () => {
            if (!confirm("削除しますか？")) return;

            records.splice(recordIndex, 1);
            saveRecords(records);
            renderRecords();
        });

card.querySelectorAll(".record-photo").forEach(async img => {
    const photoId = img.dataset.photoId;

    if (photoId) {
        const src = await getPhotoFromDB(photoId);
        img.src = src;
    }
});

        recordsContainer.appendChild(card);
    });

    saveRecords(records);
}

function selectPhotos(recordIndex) {
    const input = document.createElement("input");
    input.type = "file";
    input.accept = "image/*";
    input.multiple = true;

    input.addEventListener("change", async () => {
        const files = Array.from(input.files);

        if (files.length === 0) return;

        const records = loadRecords();

        if (!records[recordIndex].photos) {
            records[recordIndex].photos = [];
        }

        for (const file of files) {
            const compressedPhoto = await compressImage(file);
            const photoId = await savePhotoToDB(compressedPhoto);

            records[recordIndex].photos.push({
                id: photoId,
                date: records[recordIndex].date
            });
        }

        saveRecords(records);
        renderRecords();

        alert("写真を追加しました！");
    });

    input.click();
}

addRecordBtn.addEventListener("click", () => {
    const memo = prompt("メモを入力してください");
const fertilizer =
    prompt(
        "肥料を入力してください\n例：液肥、有機肥料"
    ) || "";

const pesticide =
    prompt(
        "農薬を入力してください\n例：殺虫"
    ) || "";
    if (memo === null) return;

    const records = loadRecords();

    const today = new Date().toLocaleDateString("ja-JP");

const recordDate =
    prompt(
        "日付を入力してください",
        today
    );

if (recordDate === null) return;

records.unshift({
    date: recordDate,
    memo: memo,
    fertilizer: fertilizer,
    pesticide: pesticide,
    photos: []
});

    saveRecords(records);
    renderRecords();
});

closeModalBtn.addEventListener("click", () => {
    photoModal.style.display = "none";
});

setCoverBtn.addEventListener("click", async () => {
    const records = loadRecords();

    const selectedPhoto =
        records[currentRecordIndex].photos[currentPhotoIndex];

    let selectedPhotoSrc = getPhotoSrc(selectedPhoto);

    if (!selectedPhotoSrc && selectedPhoto.id) {
        selectedPhotoSrc = await getPhotoFromDB(selectedPhoto.id);
    }

    const plants =
        JSON.parse(localStorage.getItem("plants")) || [];

    const targetPlant =
        plants.find(plant => plant.name === plantName);

    if (!targetPlant) return;

    targetPlant.coverPhoto = selectedPhotoSrc;

    localStorage.setItem("plants", JSON.stringify(plants));

    alert("表紙写真を設定しました⭐");
});

deletePhotoBtn.addEventListener("click", async () => {
    moveToUnclassifiedBtn.addEventListener("click", async () => {
    if (!confirm("この写真を未分類写真に戻しますか？")) return;

    const records = loadRecords();

    const movedPhoto =
        records[currentRecordIndex].photos[currentPhotoIndex];

    let unclassifiedPhotos =
        JSON.parse(localStorage.getItem("unclassifiedPhotos")) || [];

    unclassifiedPhotos.push(movedPhoto);

    localStorage.setItem(
        "unclassifiedPhotos",
        JSON.stringify(unclassifiedPhotos)
    );

    records[currentRecordIndex].photos.splice(currentPhotoIndex, 1);

    saveRecords(records);

    photoModal.style.display = "none";

    renderRecords();

    alert("未分類写真に戻しました");
});
    
    if (!confirm("この写真を削除しますか？")) return;

    const records = loadRecords();

    const deletedPhoto =
        records[currentRecordIndex].photos[currentPhotoIndex];

    if (deletedPhoto.id) {
        await deletePhotoFromDB(deletedPhoto.id);
    }

    records[currentRecordIndex].photos.splice(currentPhotoIndex, 1);

    saveRecords(records);

    photoModal.style.display = "none";

    renderRecords();
});

archivePlantBtn.addEventListener("click", () => {
    if (!confirm("この植物をアーカイブへ移動しますか？")) return;

    const plants = JSON.parse(localStorage.getItem("plants")) || [];

    const targetPlant = plants.find(plant => plant.name === plantName);

    if (!targetPlant) {
        alert("植物データが見つかりません");
        return;
    }

    targetPlant.archived = true;

    localStorage.setItem("plants", JSON.stringify(plants));

    alert("アーカイブへ移動しました");

    window.location.href = "index.html";
});

restorePlantBtn.addEventListener(
    "click",
    () => {

        if(
            !confirm(
                "育成中へ戻しますか？"
            )
        ) return;

        const plants =
            JSON.parse(
                localStorage.getItem(
                    "plants"
                )
            ) || [];

        const targetPlant =
            plants.find(
                plant =>
                    plant.name === plantName
            );

        if(!targetPlant) return;

        targetPlant.archived =
            false;

        localStorage.setItem(
            "plants",
            JSON.stringify(plants)
        );

        alert(
            "育成中へ戻しました"
        );

        window.location.href =
            "index.html";

    }
);

renamePlantBtn.addEventListener(
    "click",
    () => {

        const newName =
            prompt(
                "新しい植物名を入力してください",
                plantName
            );

        if (
            !newName ||
            newName === plantName
        ) {
            return;
        }

        const plants =
            JSON.parse(
                localStorage.getItem(
                    "plants"
                )
            ) || [];

        const targetPlant =
            plants.find(
                plant =>
                    plant.name === plantName
            );

        if (!targetPlant) {
            return;
        }

        const oldRecords =
            localStorage.getItem(
                "records_" + plantName
            );

        targetPlant.name =
            newName;

        localStorage.setItem(
            "plants",
            JSON.stringify(plants)
        );

        if (oldRecords) {

            localStorage.setItem(
                "records_" + newName,
                oldRecords
            );

            localStorage.removeItem(
                "records_" + plantName
            );

        }

        alert(
            "植物名を変更しました"
        );

        window.location.href =
            "plant.html?name=" +
            encodeURIComponent(
                newName
            );

    }
);

newestBtn.addEventListener("click", () => {
    sortOrder = "newest";
    localStorage.setItem("sortOrder_" + plantName, sortOrder);
    renderRecords();
});

oldestBtn.addEventListener("click", () => {
    sortOrder = "oldest";
    localStorage.setItem("sortOrder_" + plantName, sortOrder);
    renderRecords();
});

renderRecords();
</script>

</body>
</html>
