<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>未分類写真</title>
<link rel="stylesheet" href="style.css?v=13">
</head>
<body>

<a href="index.html">←トップへ戻る</a>

<h1>📷未分類写真</h1>

<button id="addUnclassifiedBtn" class="main-add-btn">
    ＋未分類写真を追加
</button>

<div class="plant-card">
    <h3>まとめて移動</h3>

    <select id="bulkPlantSelect">
        <option value="">植物を選ぶ</option>
    </select>

    <input id="bulkDateInput" type="text">

    <textarea id="bulkMemoInput" placeholder="メモ"></textarea>

    <button id="bulkMoveBtn">
        選択した写真を移動
    </button>

    <button id="bulkDeleteBtn">
        選択した写真を削除
    </button>

    <br><br>

    <button id="selectAllBtn">全部選択</button>
    <button id="clearSelectBtn">解除</button>
</div>

<div id="unclassifiedPhotos" class="photo-grid"></div>

<script>
const addUnclassifiedBtn = document.getElementById("addUnclassifiedBtn");
const unclassifiedPhotosContainer = document.getElementById("unclassifiedPhotos");

const bulkPlantSelect = document.getElementById("bulkPlantSelect");
const bulkDateInput = document.getElementById("bulkDateInput");
const bulkMemoInput = document.getElementById("bulkMemoInput");
const bulkMoveBtn = document.getElementById("bulkMoveBtn");
const bulkDeleteBtn = document.getElementById("bulkDeleteBtn");
const selectAllBtn = document.getElementById("selectAllBtn");
const clearSelectBtn = document.getElementById("clearSelectBtn");

const DB_NAME = "plantPhotoDB";
const DB_VERSION = 1;
const PHOTO_STORE = "photos";
const UNCLASSIFIED_KEY = "unclassifiedPhotos";

function openPhotoDB() {
    return new Promise((resolve, reject) => {
        const request = indexedDB.open(DB_NAME, DB_VERSION);

        request.onupgradeneeded = () => {
            const db = request.result;
            if (!db.objectStoreNames.contains(PHOTO_STORE)) {
                db.createObjectStore(PHOTO_STORE, { keyPath: "id" });
            }
        };

        request.onsuccess = () => resolve(request.result);
        request.onerror = () => reject(request.error);
    });
}

async function savePhotoToDB(src) {
    const db = await openPhotoDB();

    const photo = {
        id: Date.now().toString() + Math.random().toString(16).slice(2),
        src: src
    };

    return new Promise((resolve, reject) => {
        const transaction = db.transaction(PHOTO_STORE, "readwrite");
        const store = transaction.objectStore(PHOTO_STORE);

        store.add(photo);

        transaction.oncomplete = () => resolve(photo.id);
        transaction.onerror = () => reject(transaction.error);
    });
}

async function getPhotoFromDB(id) {
    const db = await openPhotoDB();

    return new Promise((resolve, reject) => {
        const transaction = db.transaction(PHOTO_STORE, "readonly");
        const store = transaction.objectStore(PHOTO_STORE);
        const request = store.get(id);

        request.onsuccess = () => resolve(request.result ? request.result.src : "");
        request.onerror = () => reject(request.error);
    });
}

async function deletePhotoFromDB(id) {
    const db = await openPhotoDB();

    return new Promise((resolve, reject) => {
        const transaction = db.transaction(PHOTO_STORE, "readwrite");
        const store = transaction.objectStore(PHOTO_STORE);

        store.delete(id);

        transaction.oncomplete = () => resolve();
        transaction.onerror = () => reject(transaction.error);
    });
}

function compressImage(file, maxWidth = 700, quality = 0.45) {
    return new Promise((resolve) => {
        const reader = new FileReader();

        reader.onload = () => {
            const img = new Image();

            img.onload = () => {
                const canvas = document.createElement("canvas");

                let width = img.width;
                let height = img.height;

                if (width > maxWidth) {
                    height = Math.round(height * maxWidth / width);
                    width = maxWidth;
                }

                canvas.width = width;
                canvas.height = height;

                const ctx = canvas.getContext("2d");
                ctx.drawImage(img, 0, 0, width, height);

                resolve(canvas.toDataURL("image/jpeg", quality));
            };

            img.src = reader.result;
        };

        reader.readAsDataURL(file);
    });
}

function loadUnclassifiedPhotos() {
    return JSON.parse(localStorage.getItem(UNCLASSIFIED_KEY)) || [];
}

function saveUnclassifiedPhotos(photos) {
    localStorage.setItem(UNCLASSIFIED_KEY, JSON.stringify(photos));
}

function getTodayString() {
    return new Date().toLocaleDateString("ja-JP");
}

function loadPlants() {
    return JSON.parse(localStorage.getItem("plants")) || [];
}

function renderPlantOptions() {
    const plants = loadPlants();

    const plantOptions = plants
        .filter(plant => !plant.archived)
        .map(plant => `<option value="${plant.name}">${plant.name}</option>`)
        .join("");

    bulkPlantSelect.innerHTML = `
        <option value="">植物を選ぶ</option>
        ${plantOptions}
    `;
}

async function renderUnclassifiedPhotos() {
    const photos = loadUnclassifiedPhotos();

    unclassifiedPhotosContainer.innerHTML = "";

    if (!bulkDateInput.value) {
        bulkDateInput.value = getTodayString();
    }

    if (photos.length === 0) {
        unclassifiedPhotosContainer.innerHTML =
            "<div class='plant-card'>未分類写真はありません</div>";
        return;
    }

    for (const photo of photos) {
        const item = document.createElement("div");
        item.className = "unclassified-item";
        item.dataset.photoId = photo.id;

        const src = await getPhotoFromDB(photo.id);

        item.innerHTML = `
            <div class="check-mark">✓</div>
            <img src="${src}" class="unclassified-thumb">
        `;

        item.addEventListener("click", () => {
            item.classList.toggle("selected");
        });

        unclassifiedPhotosContainer.appendChild(item);
    }
}

function getSelectedPhotoIds() {
    return Array.from(
        document.querySelectorAll(".unclassified-item.selected")
    ).map(item => item.dataset.photoId);
}

function movePhotosToPlant(photoIds, plantName, date, memo) {
    const recordsKey = "records_" + plantName;
    const records = JSON.parse(localStorage.getItem(recordsKey)) || [];

    let targetRecord = records.find(record => record.date === date);

    if (!targetRecord) {
        targetRecord = {
            date: date,
            memo: memo || "",
            fertilizer: "",
            pesticide: "",
            photos: []
        };

        records.unshift(targetRecord);
    } else {
        if (memo) {
            targetRecord.memo =
                targetRecord.memo
                    ? targetRecord.memo + "\n" + memo
                    : memo;
        }

        if (!targetRecord.photos) {
            targetRecord.photos = [];
        }
    }

    photoIds.forEach(photoId => {
        targetRecord.photos.push({
            id: photoId,
            date: date
        });
    });

    localStorage.setItem(recordsKey, JSON.stringify(records));

    const updatedPhotos =
        loadUnclassifiedPhotos().filter(photo => !photoIds.includes(photo.id));

    saveUnclassifiedPhotos(updatedPhotos);

    alert("選択した写真を移動しました！");
    renderUnclassifiedPhotos();
}

bulkMoveBtn.addEventListener("click", () => {
    const selectedPhotoIds = getSelectedPhotoIds();
    const selectedPlant = bulkPlantSelect.value;
    const selectedDate = bulkDateInput.value;
    const memo = bulkMemoInput.value;

    if (selectedPhotoIds.length === 0) {
        alert("写真を選んでください");
        return;
    }

    if (!selectedPlant) {
        alert("植物を選んでください");
        return;
    }

    if (!selectedDate) {
        alert("日付を入力してください");
        return;
    }

    movePhotosToPlant(
        selectedPhotoIds,
        selectedPlant,
        selectedDate,
        memo
    );

    bulkMemoInput.value = "";
});

bulkDeleteBtn.addEventListener("click", async () => {
    const selectedPhotoIds = getSelectedPhotoIds();

    if (selectedPhotoIds.length === 0) {
        alert("削除する写真を選んでください");
        return;
    }

    if (!confirm("選択した写真を削除しますか？")) return;

    for (const photoId of selectedPhotoIds) {
        await deletePhotoFromDB(photoId);
    }

    const updatedPhotos =
        loadUnclassifiedPhotos().filter(photo => !selectedPhotoIds.includes(photo.id));

    saveUnclassifiedPhotos(updatedPhotos);
    renderUnclassifiedPhotos();
});

selectAllBtn.addEventListener("click", () => {
    document.querySelectorAll(".unclassified-item").forEach(item => {
        item.classList.add("selected");
    });
});

clearSelectBtn.addEventListener("click", () => {
    document.querySelectorAll(".unclassified-item").forEach(item => {
        item.classList.remove("selected");
    });
});

addUnclassifiedBtn.addEventListener("click", () => {
    const input = document.createElement("input");
    input.type = "file";
    input.accept = "image/*";
    input.multiple = true;

    input.addEventListener("change", async () => {
        const files = Array.from(input.files);

        if (files.length === 0) return;

        const photos = loadUnclassifiedPhotos();

        for (const file of files) {
            const compressedPhoto = await compressImage(file);
            const photoId = await savePhotoToDB(compressedPhoto);

            photos.unshift({
                id: photoId,
                date: getTodayString(),
                createdAt: new Date().toISOString()
            });
        }

        saveUnclassifiedPhotos(photos);
        renderUnclassifiedPhotos();

        alert("未分類写真に追加しました！");
    });

    input.click();
});

renderPlantOptions();
renderUnclassifiedPhotos();
</script>

</body>
</html>
