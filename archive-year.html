<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>アーカイブ年別</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<a href="archive.html">←アーカイブへ戻る</a>

<h1 id="yearTitle"></h1>

<div id="plants"></div>

<script>
const params = new URLSearchParams(window.location.search);
const year = Number(params.get("year"));

if (!year) {
    window.location.href = "archive.html";
}

document.getElementById("yearTitle").textContent = year + "年";

const plantsContainer = document.getElementById("plants");
let plants = JSON.parse(localStorage.getItem("plants")) || [];

const archivedPlants = plants.filter(plant => {
    const plantYear = new Date(plant.startDate).getFullYear();
    return plant.archived && plantYear === year;
});

const DB_NAME = "plantPhotoDB";
const DB_VERSION = 1;
const PHOTO_STORE = "photos";

function openPhotoDB() {
    return new Promise((resolve, reject) => {
        const request = indexedDB.open(DB_NAME, DB_VERSION);

        request.onupgradeneeded = () => {
            const db = request.result;

            if (!db.objectStoreNames.contains(PHOTO_STORE)) {
                db.createObjectStore(PHOTO_STORE, {
                    keyPath: "id"
                });
            }
        };

        request.onsuccess = () => {
            resolve(request.result);
        };

        request.onerror = () => {
            reject(request.error);
        };
    });
}

async function getPhotoFromDB(id) {
    const db = await openPhotoDB();

    return new Promise((resolve, reject) => {
        const transaction = db.transaction(PHOTO_STORE, "readonly");
        const store = transaction.objectStore(PHOTO_STORE);
        const request = store.get(id);

        request.onsuccess = () => {
            resolve(request.result ? request.result.src : "");
        };

        request.onerror = () => {
            reject(request.error);
        };
    });
}

async function deletePhotoFromDB(id) {
    const db = await openPhotoDB();

    return new Promise((resolve, reject) => {
        const transaction = db.transaction(PHOTO_STORE, "readwrite");
        const store = transaction.objectStore(PHOTO_STORE);

        store.delete(id);

        transaction.oncomplete = () => resolve();
        transaction.onerror = () => reject(transaction.error);
    });
}

function getPhotoSrc(photo) {
    if (typeof photo === "string") {
        return photo;
    }

    if (photo.src) {
        return photo.src;
    }

    return "";
}

async function getLatestPhotoAndDate(plant) {
    const records =
        JSON.parse(localStorage.getItem("records_" + plant.name)) || [];

    const sortedRecordsByDate = [...records].sort((a, b) => {
        return new Date(b.date) - new Date(a.date);
    });

    let latestPhoto = null;

    for (const record of sortedRecordsByDate) {
        if (record.photos && record.photos.length > 0) {
            const lastPhoto = record.photos[record.photos.length - 1];

            latestPhoto = getPhotoSrc(lastPhoto);

            if (!latestPhoto && lastPhoto.id) {
                latestPhoto = await getPhotoFromDB(lastPhoto.id);
            }

            break;
        }
    }

    const latestDate =
        sortedRecordsByDate.length > 0
            ? sortedRecordsByDate[0].date
            : "記録なし";

    return {
        latestPhoto,
        latestDate
    };
}

async function renderArchivedPlants() {
    const archivedPlants = plants.filter(plant => {
        const plantYear = new Date(plant.startDate).getFullYear();
        return plant.archived && plantYear === year;
    });

    plantsContainer.innerHTML = "";

    if (archivedPlants.length === 0) {
        plantsContainer.innerHTML =
            "<div class='plant-card'>この年のアーカイブはありません</div>";
        return;
    }

    for (const plant of archivedPlants) {
        const card = document.createElement("div");
        card.className = "plant-card";

        const { latestPhoto, latestDate } =
            await getLatestPhotoAndDate(plant);

        const displayPhoto =
            plant.coverPhoto || latestPhoto;

        card.innerHTML = `
            ${
                displayPhoto
                    ? `<img src="${displayPhoto}" class="plant-thumb">`
                    : `<div class="plant-thumb placeholder">🌱</div>`
            }
            <div class="plant-name">${plant.name}</div>
            <div class="plant-updated">${latestDate}</div>
            <button class="deletePlantBtn">🗑完全削除</button>
        `;

        card.style.cursor = "pointer";

        card.querySelector(".deletePlantBtn").addEventListener(
            "click",
            async (event) => {
                event.stopPropagation();

                if (
                    !confirm(
                        plant.name +
                        " を完全削除しますか？\n写真も記録も全部消えます。"
                    )
                ) {
                    return;
                }

                const records =
                    JSON.parse(
                        localStorage.getItem(
                            "records_" + plant.name
                        )
                    ) || [];

                for (const record of records) {
                    if (!record.photos) continue;

                    for (const photo of record.photos) {
                        if (photo.id) {
                            await deletePhotoFromDB(photo.id);
                        }
                    }
                }

                localStorage.removeItem(
                    "records_" + plant.name
                );

                plants = plants.filter(
                    p => p.name !== plant.name
                );

                localStorage.setItem(
                    "plants",
                    JSON.stringify(plants)
                );

                alert("完全削除しました");

                renderArchivedPlants();
            }
        );

        card.addEventListener("click", () => {
            window.location.href =
                "plant.html?name=" +
                encodeURIComponent(plant.name);
        });

        plantsContainer.appendChild(card);
    }
}

renderArchivedPlants();

</script>

</body>
</html>
